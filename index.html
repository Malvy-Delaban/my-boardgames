<!-- SCRIPTS -->
<script>
    function isTodo(game) {
        if (game.ratings.gameplayLulu == 0 || game.ratings.gameplayMalvy == 0 || game.ratings.visualLulu == 0 || game.ratings.visualMalvy == 0)
            return true;
        return false;
    }

    function getRandomGameFromFilter() {
        const availableGames = [];
        collection.forEach(game => {
            if (game.isDisplayed && !game.extensionOf)
                availableGames.push(game);
        });
        if (!availableGames.length)
            alert("No game found with those filters");
        else
            focuseGame(availableGames[getRandomInt(availableGames.length)]);
    }

    function closeFocus() {
        url.searchParams.delete("game");
        window.history.replaceState({}, "", url);

        const focusContainer = document.getElementById("game-focus-container");
        focusContainer.classList.remove("game-focuse-disabled");
        focusContainer.classList.add("game-focuse-disabled");
        focusGame = null;
    }

    function getColorFromGradient(min, max, value, startHex, endHex) {
        // 1. Normalize the value to a fraction between 0 and 1
        const fraction = Math.max(0, Math.min(1, (value - min) / (max - min)));

        // 2. Helper function to parse hex to RGB components
        const hexToRgb = hex => {
            const num = parseInt(hex.replace("#", ""), 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        };

        const start = hexToRgb(startHex);
        const end = hexToRgb(endHex);

        // 3. Linearly interpolate each channel
        const r = Math.round(start.r + fraction * (end.r - start.r));
        const g = Math.round(start.g + fraction * (end.g - start.g));
        const b = Math.round(start.b + fraction * (end.b - start.b));

        return `rgb(${r}, ${g}, ${b})`;
    }

    function getMultiColorGradient(min, max, value, colorArray, opacity) {
        // Normalize value to a 0-1 scale
        const fraction = Math.max(0, Math.min(1, (value - min) / (max - min)));

        if (fraction === 1) return colorArray[colorArray.length - 1];

        // Find which segment the fraction falls into
        const segmentCount = colorArray.length - 1;
        const scaledFraction = fraction * segmentCount;
        const index = Math.floor(scaledFraction); // Start color index
        const segmentFraction = scaledFraction - index; // Progress within segment

        const hexToRgb = hex => {
            const num = parseInt(hex.replace("#", ""), 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        };

        const start = hexToRgb(colorArray[index]);
        const end = hexToRgb(colorArray[index + 1]);

        const r = Math.round(start.r + segmentFraction * (end.r - start.r));
        const g = Math.round(start.g + segmentFraction * (end.g - start.g));
        const b = Math.round(start.b + segmentFraction * (end.b - start.b));

        return `rgb(${r} ${g} ${b} / ${opacity}%)`;
    }

    function truncToOneDecimal(x) {
        return Number.parseFloat(x).toFixed(1);
    }

    function setSingleRatingFilling(selector, user, value) {
        const colors = ["#f6785e", "#cffd5e", "#54ffef"];
        const visualMalvy = document.getElementById("rating-" + selector + "-" + user);
        visualMalvy.style.width = value + "%";
        visualMalvy.style.background = "linear-gradient(0.25turn, " + getMultiColorGradient(0, 200, value, colors, 80) + ", " + getMultiColorGradient(0, 100, value, colors, 100) + ")";
    }

    function setRatingFilling(values) {
        setSingleRatingFilling("gameplay", "lulu", values.gameplayLulu);
        setSingleRatingFilling("gameplay", "malvy", values.gameplayMalvy);
        setSingleRatingFilling("visual", "lulu", values.visualLulu);
        setSingleRatingFilling("visual", "malvy", values.visualMalvy);
    }

    function setRatingValue(values) {
        const gameplayLulu = document.getElementById("rating-gameplay-lulu-value");
        gameplayLulu.innerHTML = truncToOneDecimal(values.gameplayLulu / 10);
        const gameplayMalvy = document.getElementById("rating-gameplay-malvy-value");
        gameplayMalvy.innerHTML = truncToOneDecimal(values.gameplayMalvy / 10);
        const visualLulu = document.getElementById("rating-visual-lulu-value");
        visualLulu.innerHTML = truncToOneDecimal(values.visualLulu / 10);
        const visualMalvy = document.getElementById("rating-visual-malvy-value");
        visualMalvy.innerHTML = truncToOneDecimal(values.visualMalvy / 10);
    }

    function handleRankPerson(person, game) {
        const elementRank = document.getElementById(`${person}-rank-medal`);
        elementRank.classList.remove("hidden-medal");
        const personRank = (person == "lulu" ? ranksLulu : ranksMalvy);
        elementRank.title = "";

        if (game.name == personRank[0]) {
            elementRank.src = `assets/medals/${person}-top1.png`;
            elementRank.title = `${person}'s top 1`;
        } else if (game.name == personRank[1]) {
            elementRank.src = `assets/medals/${person}-top2.png`;
            elementRank.title = `${person}'s top 2`;
        } else if (game.name == personRank[2]) {
            elementRank.src = `assets/medals/${person}-top3.png`;
            elementRank.title = `${person}'s top 3`;
        } else
            elementRank.classList.add("hidden-medal");
    }

    function handleMedals(game) {
        handleRankPerson("lulu", game);
        handleRankPerson("malvy", game);
    }

    function focuseGame(game) {
        url.searchParams.set('game', game.slug);
        window.history.replaceState({ game: game.name }, game.name, url);

        const focusContainer = document.getElementById("game-focus-container");
        focusContainer.classList.remove("game-focuse-disabled");
        const focusTitle = document.getElementById("game-focus-title");
        focusTitle.innerHTML = game.name;
        const focusImg = document.getElementById("focused-img");
        focusImg.src = gamesImgPath + game.name + ".png";
        const focusTags = document.getElementById("game-focus-tags");
        focusTags.innerHTML = "";
        focusTags.appendChild(getTagListElement(game));
        setRatingFilling(game.ratings);
        setRatingValue(game.ratings);
        focusGame = game;
        handleMedals(game);
    }

    function getRandomInt(max) {
        return Math.floor(Math.random() * max);
    }

    function getSingleTagElement(text, tagClass) {
        const newDiv = document.createElement("div");
        newDiv.innerHTML = text;
        newDiv.classList.add("single-tag");
        newDiv.classList.add(tagClass);
        return newDiv;
    }

    function getTagListElement(game) {
        const newDiv = document.createElement("div");
        newDiv.classList.add("tag-list");
        if (game.extensionOf)
            newDiv.appendChild(getSingleTagElement("Extension", "extension-tag"));
        if (game.playerMin != game.playerMax)
            newDiv.appendChild(getSingleTagElement(game.playerMin + "-" + game.playerMax + "P", "player-tag"));
        else
            newDiv.appendChild(getSingleTagElement(game.playerMin + "P", "player-tag"));
        if (game.playerMin <= 1)
            newDiv.appendChild(getSingleTagElement("Solo", "solo-tag"));
        game.gamemodes.forEach((gamemode) => {
            if (gamemode == "Coop")
                newDiv.appendChild(getSingleTagElement(gamemode, "coop-tag"));
            else if (gamemode == "Comp")
                newDiv.appendChild(getSingleTagElement(gamemode, "comp-tag"));
            else if (gamemode == "Duo")
                newDiv.appendChild(getSingleTagElement(gamemode, "duo-tag"));
            else if (gamemode === "Party Game")
                newDiv.appendChild(getSingleTagElement(gamemode, "partygame-tag"));
        });
        return newDiv;
    }

    function getGameContainer(game) {
        const newDiv = document.createElement("div");
        newDiv.classList.add("single-game-container")
        newDiv.onclick = function () {
            focuseGame(game);
        }
        const newImg = document.createElement("img");
        newImg.src = gamesImgPath + game.name + ".png";
        newImg.classList.add("game-img");
        const newTitle = document.createElement("h3");
        newTitle.innerHTML = game.name;
        const newTagList = getTagListElement(game);
        const toRateDiv = document.createElement("div");
        toRateDiv.classList.add("to-rate-pin");
        toRateDiv.innerHTML = "TODO"
        newDiv.appendChild(newTitle);
        if (isTodo(game))
            newDiv.appendChild(toRateDiv);
        newDiv.appendChild(newImg);
        newDiv.appendChild(newTagList);
        return newDiv;
    }

    function fillCollectionContainer(collection) {
        const containerDiv = document.getElementById("my-collection");
        collection.forEach((singleGame) => {
            if (singleGame.isDisplayed)
                containerDiv.appendChild(getGameContainer(singleGame));
        });
    }

    function setDisplayGameNumber(gameNbms) {
        const textElement = document.getElementById("game-number");
        if (gameNbms[0] > 0)
            textElement.innerHTML = `${gameNbms[0]} games and ${gameNbms[1]} extensions found`;
        else
            textElement.innerHTML = "No games found with selected filters";
    }

    function getCollection() {
        return boardGames;
    }

    function resetDisplay() {
        const containerDiv = document.getElementById("my-collection");
        containerDiv.innerHTML = '';
        setDisplayGameNumber([0, 0]);
        defaultSelection();
    }

    function compareString(a, b) {
        if (a.name < b.name)
            return -1;
        if (a.name > b.name)
            return 1;
        return 0;
    }

    function defaultSelection() {
        collection = collection.sort(compareString);
        collection.forEach(game => {
            game.isDisplayed = true;
        });
    }

    function filterByDuo() {
        duoFilterStatus = !duoFilterStatus;
        const statusButton = document.getElementById("duo-button");
        statusButton.classList.remove("unselected-filter")
        if (!duoFilterStatus)
            statusButton.classList.add("unselected-filter")
        applyCurrentFilters()
    }

    function filterByCoop() {
        coopFilterStatus = !coopFilterStatus;
        const statusButton = document.getElementById("coop-button");
        statusButton.classList.remove("unselected-filter")
        if (!coopFilterStatus)
            statusButton.classList.add("unselected-filter")
        applyCurrentFilters()
    }

    function filterByTodo() {
        todoFilterStatus = !todoFilterStatus;
        const statusButton = document.getElementById("todo-button");
        statusButton.classList.remove("unselected-filter")
        if (!todoFilterStatus)
            statusButton.classList.add("unselected-filter")
        applyCurrentFilters();
    }

    function filterByComp() {
        compFilterStatus = !compFilterStatus;
        const statusButton = document.getElementById("comp-button");
        statusButton.classList.remove("unselected-filter")
        if (!compFilterStatus)
            statusButton.classList.add("unselected-filter")
        applyCurrentFilters()
    }

    function filterByPartyGame() {
        partyGameFilterStatus = !partyGameFilterStatus;
        const statusButton = document.getElementById("partygame-button");
        statusButton.classList.remove("unselected-filter")
        if (!partyGameFilterStatus)
            statusButton.classList.add("unselected-filter")
        applyCurrentFilters()
    }

    function filterByPlayer() {
        playerFilterStatus = !playerFilterStatus;
        const statusButton = document.getElementById("player-button");
        statusButton.classList.remove("unselected-filter")
        if (!playerFilterStatus)
            statusButton.classList.add("unselected-filter")
        applyCurrentFilters();
    }

    function playerFilterPlus() {
        if (!playerFilterStatus) {
            playerFilterStatus = true;
            const statusButton = document.getElementById("player-button");
            statusButton.classList.remove("unselected-filter")
        }

        playerFilterNumber++;
        const statusButtonCount = document.getElementById("player-number-filter");
        statusButtonCount.innerHTML = playerFilterNumber;
        applyCurrentFilters();
    }

    function playerFilterMinus() {
        if (!playerFilterStatus) {
            playerFilterStatus = true;
            const statusButton = document.getElementById("player-button");
            statusButton.classList.remove("unselected-filter")
        }

        if (playerFilterNumber > 1)
            playerFilterNumber--;
        const statusButtonCount = document.getElementById("player-number-filter");
        statusButtonCount.innerHTML = playerFilterNumber;
        applyCurrentFilters();
    }

    function applyCurrentFilters() {
        resetDisplay();
        collection.forEach(game => {
            if (!game.gamemodes.includes("Duo") && duoFilterStatus)
                game.isDisplayed = false;
            if (!game.gamemodes.includes("Coop") && coopFilterStatus)
                game.isDisplayed = false;
            if (!game.gamemodes.includes("Comp") && compFilterStatus)
                game.isDisplayed = false;
            if (!isTodo(game) && todoFilterStatus)
                game.isDisplayed = false;
            if (!game.gamemodes.includes("Party Game") && partyGameFilterStatus)
                game.isDisplayed = false;
            if (playerFilterStatus && (playerFilterNumber < game.playerMin || playerFilterNumber > game.playerMax))
                game.isDisplayed = false;
        });
        setDisplayGameNumber(getValidGameNumber(collection));
        fillCollectionContainer(collection);
    }

    function getValidGameNumber(collection) {
        var gameNmb = 0;
        var extensionNmb = 0;
        collection.forEach(game => {
            if (game.isDisplayed && !game.extensionOf)
                gameNmb++;
            else if (game.isDisplayed && game.extensionOf)
                extensionNmb++;
        });
        return [gameNmb, extensionNmb];
    }

    function getGameFromName(name) {
        var game = null;
        collection.forEach((obj) => {
            if (obj.name == name)
                game = obj;
        });
        return game;
    }

    function getGameFromSlug(slug) {
        var game = null;
        collection.forEach((obj) => {
            if (obj.slug == slug)
                game = obj;
        });
        return game;
    }

    // INIT VARIABLES
    const url = new URL(window.location);
    var focusGame = null;
    var playerFilterNumber = 1;
    var playerFilterStatus = false;
    var duoFilterStatus = false;
    var coopFilterStatus = false;
    var todoFilterStatus = false;
    var compFilterStatus = false;
    var partyGameFilterStatus = false;
    const defaultCollection = getCollection();
    var collection = defaultCollection;
    const gamesImgPath = "assets/games/";

    // SET DEFAULT DISPLAY
    defaultSelection();
    setDisplayGameNumber(getValidGameNumber(collection));
    fillCollectionContainer(collection);

    // OPEN FOCUSED GAME IF URL CONTAINS A SPECIFIC GAME
    const gameParam = url.searchParams.get("game");
    if (gameParam) {
        var urlSpecifiedGame = getGameFromSlug(gameParam);
        if (urlSpecifiedGame)
            focuseGame(urlSpecifiedGame);
    }
</script>

</html>
